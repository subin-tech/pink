site_name: MelodifyAI
site_url: https://subin-tech.github.io/pink/
theme:
  name: material
nav:
  - Home: index.md
  - Proposal: proposal.md
  - Team rules: team-rules.md
  - API: api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              returns_named_value: false
